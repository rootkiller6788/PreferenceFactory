[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preferencefactory"
version = "0.1.0"
description = "PreferenceFactory —— 偏好证据的产生、验证、去噪与版本化（零第三方依赖）"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
preferencefactory = "preferencefactory.cli:main"

[project.optional-dependencies]
# 重型接入点一律写成抛 NotImplementedError 的扩展点，不放进核心链路。
torch = ["torch>=2.2"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
