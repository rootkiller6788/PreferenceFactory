name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 核心链路零依赖；pytest 只是 tests/ 里入口契约用例的跑分器。
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Contract tests
        run: python -m pytest
      - name: Pipeline
        run: python main.py run
      - name: Acceptance
        run: python main.py acceptance
      - name: Adversarial
        run: python main.py adversarial
